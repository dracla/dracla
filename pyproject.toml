[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dracla"
version = "0.0.1"
description = "GitHub-native Contributor License Agreement administration"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Omry Yadan" }]
keywords = ["cla", "github", "contributor-license-agreement", "open-source"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

# hydra-core is a CLI-side dependency for config composition (design 6.9), and
# returns with the CLI. core imports nothing and must never import Hydra:
# composition happens on the client and what reaches core is a resolved dict.
#
# Tracking the 1.4 development line deliberately, not 1.3 stable. The lower
# bound names a pre-release so PEP 440 permits resolving to one; it floats
# forward to 1.4.0 final. requires-python above is 3.10 rather than 3.9 in
# anticipation of that return: Hydra 1.4 requires Python >= 3.10.
dependencies = []

[project.urls]
Homepage = "https://github.com/dracla/dracla"
Source = "https://github.com/dracla/dracla"

# The `dracla` console script returns with the CLI; see design/high-level-design.md §6.10.
# [project.scripts]
# dracla = "dracla_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["core/dracla"]
