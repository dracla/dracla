[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dracla"
version = "0.0.1"
description = "GitHub-native Contributor License Agreement administration"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Omry Yadan" }]
keywords = ["cla", "github", "contributor-license-agreement", "open-source"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

# The revision-10 CLI was removed after the reviewed revision-13 design changed
# the provisioning and confidentiality model. Core remains dependency-free.
dependencies = []

[project.urls]
Homepage = "https://github.com/dracla/dracla"
Source = "https://github.com/dracla/dracla"

[tool.hatch.build.targets.wheel]
packages = ["core/dracla"]
