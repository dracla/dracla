[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dracla"
version = "0.0.1"
description = "GitHub-native Contributor License Agreement administration"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Omry Yadan" }]
keywords = ["cla", "github", "contributor-license-agreement", "open-source"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

# Client composition follows the release-tested Hydra 1.4 distribution (design §6.9).
# Keep the conformance kernel's JCS and AES-GCM implementations exact and
# release-tested.
dependencies = ["cryptography==50.0.1", "rfc8785==0.1.4", "hydra-core==1.4.0.dev8", "packaging==26.3"]

[project.scripts]
dracla = "dracla.cli:main"

[project.urls]
Homepage = "https://github.com/dracla/dracla"
Source = "https://github.com/dracla/dracla"

[tool.hatch.build.targets.wheel]
packages = ["core/dracla"]
