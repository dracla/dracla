[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dracla"
version = "0.0.1"
description = "GitHub-native Contributor License Agreement administration"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Omry Yadan" }]
keywords = ["cla", "github", "contributor-license-agreement", "open-source"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

# hydra-core is a CLI-side dependency for config composition (design 6.9).
# The core package must never import it: composition happens on the client and
# what reaches core is a resolved plain dict. tests/test_layering.py enforces it.
dependencies = ["hydra-core>=1.3"]

[project.urls]
Homepage = "https://github.com/dracla/dracla"
Source = "https://github.com/dracla/dracla"

[project.scripts]
dracla = "dracla_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["core/dracla", "cli/dracla_cli"]
