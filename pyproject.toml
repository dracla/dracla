[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dracla"
version = "0.0.1"
description = "GitHub-native Contributor License Agreement administration"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Omry Yadan" }]
keywords = ["cla", "github", "contributor-license-agreement", "open-source"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

# hydra-core composes the CLI's configuration (design 6.9, 6.10.3) via the
# Compose API. core imports nothing and must never import Hydra: composition
# resolves on the client and what reaches core is plain, inert data.
#
# Tracking the 1.4 development line deliberately, not 1.3 stable. The lower
# bound names a pre-release so PEP 440 permits resolving to one; it floats
# forward to 1.4.0 final. Hydra 1.4 requires Python >= 3.10, which is why
# requires-python above is 3.10 rather than 3.9.
dependencies = ["hydra-core>=1.4.0.dev8"]

[project.urls]
Homepage = "https://github.com/dracla/dracla"
Source = "https://github.com/dracla/dracla"

[project.scripts]
dracla = "dracla_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["core/dracla", "cli/dracla_cli"]
