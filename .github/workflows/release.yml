name: DraCLA verified release
on:
  workflow_dispatch:
permissions: {}
jobs:
  build:
    # GitHub resolves a relative reusable workflow at the caller's SAME commit.
    # This is immutable without embedding a circular self-commit hash in source.
    uses: ./.github/workflows/build-release.yml
    with:
      source-oid: ${{ github.sha }}
    permissions:
      contents: read
      id-token: write
      attestations: write
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi-release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dracla-release-wheel
          path: built
      - name: Select exactly the tested wheel
        run: |
          mkdir dist
          python3 -c 'from pathlib import Path; import shutil; w=list(Path("built").glob("*.whl")); assert len(w)==1; shutil.copyfile(w[0],Path("dist")/w[0].name)'
      - name: Publish the same wheel with PyPI's standard attestation
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          attestations: true
          packages-dir: dist
